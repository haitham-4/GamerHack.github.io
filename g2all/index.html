<!DOCTYPE html>
<html manifest="offline.manifest" lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفعيل PS4 - عالم الألعاب</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #05070f;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            direction: rtl;
        }

        /* الحاوية الرئيسية لملء الشاشة بالكامل */
        .main-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* جعل صورة بنر عالم الألعاب تغطي الشاشة بشكل تناسقي */
        .banner-img {
            width: 100%;
            height: 100%;
            object-fit: contain; /* تظهر الصورة بأكبر حجم ممكن دون تشويه */
            display: block;
        }

        /* وضع النص في منتصف المستطيل المرسوم داخل الصورة تماماً */
        .status-overlay {
            position: absolute;
            top: 48.5%; /* محاذاة دقيقة لمنتصف المستطيل المرسوم في الصورة */
            left: 50%;
            transform: translate(-50%, -50%);
            width: 55%;
            text-align: center;
            background: transparent; /* إزالة أي خلفية إضافية */
            border: none;
            box-shadow: none;
        }

        /* تنسيق النصوص العربية */
        .status-text {
            font-size: 1.6rem;
            font-weight: bold;
            color: #00d2ff;
            text-shadow: 0 0 10px rgba(0, 210, 255, 0.9);
            white-space: nowrap;
        }

        /* لون عند نجاح التفعيل */
        .success-text {
            color: #00ff88 !important;
            text-shadow: 0 0 10px rgba(0, 255, 136, 0.9) !important;
        }

        /* لون عند فشل التفعيل */
        .error-text {
            color: #ff4d4d !important;
            text-shadow: 0 0 10px rgba(255, 77, 77, 0.9) !important;
            white-space: normal;
            font-size: 1.1rem;
            line-height: 1.4;
        }

        /* تجاوب الخط مع الشاشات الصغيرة والجوالات */
        @media (max-width: 600px) {
            .status-text {
                font-size: 0.95rem;
            }
            .error-text {
                font-size: 0.75rem;
            }
        }
    </style>
</head>
<body>

    <div class="main-container">
        <!-- صورة بنر عالم الألعاب -->
        <img src="../logo.png" alt="عالم الألعاب" class="banner-img">

        <!-- النص بدون أي إطار إضافي ليتطابق مع إطار الصورة -->
        <div class="status-overlay">
            <div class="status-text" id="msgs">جاري التفعيل تلقائياً... 0%</div>
        </div>
    </div>

    <!-- كود الجافاسكريبت للتحكم بالنصوص والتحميل -->
    <script>
        if (window.applicationCache) {
            var appCache = window.applicationCache;
            var msgBox = document.getElementById('msgs');

            appCache.addEventListener('checking', function() {
                msgBox.innerHTML = "جاري التفعيل تلقائياً...";
            }, false);

            appCache.addEventListener('downloading', function() {
                msgBox.innerHTML = "جاري التفعيل تلقائياً: 0%";
            }, false);

            appCache.addEventListener('progress', function(e) {
                if (e.lengthComputable && e.total > 0) {
                    var percent = Math.round((e.loaded / e.total) * 100);
                    msgBox.innerHTML = "جاري التفعيل تلقائياً: " + percent + "%";
                } else {
                    msgBox.innerHTML = "جاري التفعيل تلقائياً...";
                }
            }, false);

            appCache.addEventListener('cached', function() {
                msgBox.className = "status-text success-text";
                msgBox.innerHTML = "نجح التفعيل";
            }, false);

            appCache.addEventListener('noupdate', function() {
                msgBox.className = "status-text success-text";
                msgBox.innerHTML = "نجح التفعيل";
            }, false);

            appCache.addEventListener('error', function() {
                msgBox.className = "status-text error-text";
                msgBox.innerHTML = "فشل التفعيل يرجى اعاده تشغيل السوني والمحاوله مره اخرا";
            }, false);
        }
    </script>
</body>
</html>
