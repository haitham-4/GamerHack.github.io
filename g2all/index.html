<!DOCTYPE html>
<html manifest="offline.manifest" lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفعيل PS4 - عالم الألعاب</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #05070f;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            direction: rtl;
        }

        /* حاوية الشاشة الكاملة */
        .main-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* تمطيط صورة البنر لتملأ الشاشة بالكامل */
        .banner-img {
            width: 100vw;
            height: 100vh;
            object-fit: fill; 
            display: block;
        }

        /* المستطيل الأسود المطابق تماماً لإطار الصورة مع التوسيط العمودي والأفقي */
        .status-overlay {
            position: absolute;
            top: 46.8%; /* مطابقة مكان المستطيل في تصميم الصورة */
            left: 50%;
            transform: translate(-50%, -50%);
            width: 51.5%; /* العرض المطابق لإطار الصورة */
            height: 14.5%; /* الارتفاع المطابق لإطار الصورة */
            background: rgba(0, 0, 0, 0.95); /* يغطي المستطيل المرسوم في الصورة تماماً */
            border-radius: 14px;
            padding: 5px 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            transition: all 0.3s ease-in-out;
        }

        /* 1. حواف أزرق (عند حفظ وتحميل الصفحة) */
        .state-blue {
            border: 3px solid #00d2ff;
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.8);
            color: #00d2ff;
        }

        /* 2. حواف أصفر (عند بدء تفعيل القولدهين) */
        .state-yellow {
            border: 3px solid #ffcc00;
            box-shadow: 0 0 15px rgba(255, 204, 0, 0.8);
            color: #ffcc00;
        }

        /* 3. حواف أخضر (عند نجاح العملية) */
        .state-green {
            border: 3px solid #00ff88;
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.8);
            color: #00ff88;
        }

        /* 4. حواف أحمر (عند الفشل) */
        .state-red {
            border: 3px solid #ff4d4d;
            box-shadow: 0 0 15px rgba(255, 77, 77, 0.8);
            color: #ff4d4d;
        }

        /* تنسيق النص الداخلي والتوسيط */
        .status-text {
            font-size: 1.4rem;
            font-weight: bold;
            line-height: 1.3;
            text-shadow: 0 0 8px currentColor;
            width: 100%;
        }

        /* تجاوب الخط على الجوالات في الوضع الطولي */
        @media (max-width: 600px) and (orientation: portrait) {
            .status-overlay {
                width: 60%;
                height: 10%;
                top: 47%;
            }
            .status-text {
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>

    <div class="main-container">
        <!-- صورة البنر ممتدة ملء الشاشة -->
        <img src="../logo.png" alt="عالم الألعاب" class="banner-img">

        <!-- المستطيل في منتصف إطار الصورة بالضبط -->
        <div class="status-overlay state-blue" id="box">
            <div class="status-text" id="msgs">جاري تحميل الصفحة... 0%</div>
        </div>
    </div>

    <script>
        var box = document.getElementById('box');
        var msgBox = document.getElementById('msgs');

        // دالة تحديث لون الحواف والنص
        function setStatus(stateClass, text) {
            box.className = "status-overlay " + stateClass;
            msgBox.innerHTML = text;
        }

        if (window.applicationCache) {
            var appCache = window.applicationCache;

            // 1. مرحلة التحميل والحفظ (حواف زرقاء)
            appCache.addEventListener('checking', function() {
                setStatus('state-blue', 'جاري تحميل الصفحة...');
            }, false);

            appCache.addEventListener('downloading', function() {
                setStatus('state-blue', 'جاري تحميل الصفحة... 0%');
            }, false);

            appCache.addEventListener('progress', function(e) {
                if (e.lengthComputable && e.total > 0) {
                    var percent = Math.round((e.loaded / e.total) * 100);
                    setStatus('state-blue', 'جاري تحميل الصفحة... ' + percent + '%');
                } else {
                    setStatus('state-blue', 'جاري تحميل الصفحة...');
                }
            }, false);

            // 2. مرحلة بدء تفعيل القولدهين (حواف صفراء)
            appCache.addEventListener('cached', function() {
                startGoldhenActivation();
            }, false);

            appCache.addEventListener('noupdate', function() {
                startGoldhenActivation();
            }, false);

            // 3. مرحلة الفشل (حواف حمراء)
            appCache.addEventListener('error', function() {
                setStatus('state-red', 'فشل التفعيل يرجى اعاده تشغيل السوني والمحاوله مره اخرا');
            }, false);
        } else {
            startGoldhenActivation();
        }

        // دالة بدء تفعيل القولدهين
        function startGoldhenActivation() {
            // أصفر أثناء بدء التفعيل
            setStatus('state-yellow', 'جاري التفعيل التلقائي...');

            // عند نجاح التفعيل من كود الثغرة يتم استدعاء:
            // setStatus('state-green', 'نجحت العملية');
        }
    </script>
</body>
</html>
