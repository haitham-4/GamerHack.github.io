<!DOCTYPE html>
<html manifest="offline.manifest" lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفعيل PS4</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #0b0c10;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            direction: rtl;
            color: #ffffff;
        }

        /* حاوية اللوقو الرئيسية في المنتصف */
        .logo-wrapper {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 90%;
            max-width: 550px;
        }

        /* اللوقو الخاص بك */
        .logo-img {
            width: 100%;
            height: auto;
            display: block;
            filter: drop-shadow(0 0 15px rgba(0, 210, 255, 0.3));
        }

        /* المستطيل في منتصف اللوقو لعرض النصوص */
        .status-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            background: rgba(0, 0, 0, 0.85);
            border: 2px solid #00d2ff;
            border-radius: 12px;
            padding: 18px 10px;
            text-align: center;
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.5);
        }

        /* نصوص الحالة باللغة العربية */
        .status-text {
            font-size: 1.4rem;
            font-weight: bold;
            color: #00d2ff;
            text-shadow: 0 0 10px rgba(0, 210, 255, 0.8);
            line-height: 1.5;
        }

        /* لون حالة النجاح */
        .success-text {
            color: #00ff88 !important;
            text-shadow: 0 0 10px rgba(0, 255, 136, 0.8) !important;
            border-color: #00ff88 !important;
        }

        /* لون حالة الفشل */
        .error-text {
            color: #ff4d4d !important;
            text-shadow: 0 0 10px rgba(255, 77, 77, 0.8) !important;
            border-color: #ff4d4d !important;
        }
    </style>
</head>
<body>

    <!-- حاوية اللوقو والنص -->
    <div class="logo-wrapper">
        <img src="../logo.png" alt="Logo" class="logo-img">
        
        <!-- المستطيل الأسود الداخلي للنصوص -->
        <div class="status-overlay" id="box">
            <div class="status-text" id="msgs">جاري التفعيل تلقائياً... 0%</div>
        </div>
    </div>

    <!-- كود التحكم بالنصوص والتثبيت -->
    <script>
        if (window.applicationCache) {
            var appCache = window.applicationCache;
            var msgBox = document.getElementById('msgs');

            appCache.addEventListener('checking', function() {
                msgBox.innerHTML = "جاري التفعيل تلقائياً...";
            }, false);

            appCache.addEventListener('downloading', function() {
                msgBox.innerHTML = "جاري التفعيل تلقائياً: 0%";
            }, false);

            appCache.addEventListener('progress', function(e) {
                if (e.lengthComputable && e.total > 0) {
                    var percent = Math.round((e.loaded / e.total) * 100);
                    msgBox.innerHTML = "جاري التفعيل تلقائياً: " + percent + "%";
                } else {
                    msgBox.innerHTML = "جاري التفعيل تلقائياً...";
                }
            }, false);

            appCache.addEventListener('cached', function() {
                msgBox.className = "status-text success-text";
                msgBox.innerHTML = "نجح التفعيل";
            }, false);

            appCache.addEventListener('noupdate', function() {
                msgBox.className = "status-text success-text";
                msgBox.innerHTML = "نجح التفعيل";
            }, false);

            // عند الفشل يظهر النص المطلق بالكامل
            appCache.addEventListener('error', function() {
                msgBox.className = "status-text error-text";
                msgBox.innerHTML = "فشل التفعيل يرجى اعاده تشغيل السوني والمحاوله مره اخرا";
            }, false);
        }
    </script>
</body>
</html>
