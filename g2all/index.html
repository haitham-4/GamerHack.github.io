<!DOCTYPE html>
<html manifest="offline.manifest" lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عالم الألعاب - تفعيل PS4</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: radial-gradient(circle at center, #0b1a3a 0%, #030814 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            direction: rtl;
            color: #ffffff;
        }

        /* حاوية الشاشة الرئيسية */
        .app-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 2vh 2vw;
            position: relative;
        }

        /* 1. قسم العنوان والشعار العالي الدقة */
        .header-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 1vh;
        }

        .main-title {
            font-size: clamp(2.2rem, 5vw, 4rem);
            font-weight: 900;
            background: linear-gradient(180deg, #ffffff 0%, #00d2ff 50%, #ff007f 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(0, 210, 255, 0.4);
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .version-badge {
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid #ffcc00;
            color: #ffcc00;
            padding: 4px 18px;
            border-radius: 20px;
            font-size: clamp(0.75rem, 1.8vw, 1.1rem);
            font-weight: bold;
            box-shadow: 0 0 10px rgba(255, 204, 0, 0.3);
        }

        /* 2. قسم المستطيل التفاعلي والتوسيط */
        .status-section {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: auto 0;
        }

        .status-overlay {
            width: min(750px, 88vw);
            min-height: clamp(90px, 14vh, 130px);
            background: rgba(5, 8, 20, 0.92);
            border-radius: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 15px 20px;
            transition: all 0.4s ease;
            backdrop-filter: blur(5px);
        }

        /* ألوان الحواف المضيئة والنصوص حسب الحالة */
        .state-blue {
            border: 3px solid #00d2ff;
            box-shadow: 0 0 25px rgba(0, 210, 255, 0.6);
            color: #00d2ff;
        }

        .state-yellow {
            border: 3px solid #ffcc00;
            box-shadow: 0 0 25px rgba(255, 204, 0, 0.6);
            color: #ffcc00;
        }

        .state-green {
            border: 3px solid #00ff88;
            box-shadow: 0 0 25px rgba(0, 255, 136, 0.6);
            color: #00ff88;
        }

        .state-red {
            border: 3px solid #ff4d4d;
            box-shadow: 0 0 25px rgba(255, 77, 77, 0.6);
            color: #ff4d4d;
        }

        .status-text {
            font-size: clamp(1.1rem, 2.8vw, 1.8rem);
            font-weight: bold;
            line-height: 1.3;
            text-shadow: 0 0 10px currentColor;
        }

        /* 3. قسم أزرار الخدمات المصممة بكود عالي الدقة */
        .services-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: max(8px, 1.2vw);
            width: min(850px, 92vw);
            margin-bottom: 1.5vh;
        }

        .service-card {
            background: rgba(10, 20, 45, 0.8);
            border: 1.5px solid #ffcc00;
            border-radius: 12px;
            padding: 8px 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
        }

        .service-icon {
            width: clamp(24px, 4vw, 36px);
            height: clamp(24px, 4vw, 36px);
            fill: #00d2ff;
        }

        .service-title {
            font-size: clamp(0.7rem, 1.4vw, 1rem);
            font-weight: bold;
            color: #ffffff;
            white-space: nowrap;
        }

        /* 4. قسم التذييل والموقع */
        .footer-section {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            padding-bottom: 0.5vh;
        }

        .footer-arc {
            width: 85%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #ffcc00, transparent);
            margin-bottom: 6px;
        }

        .phone-num {
            color: #ffffff;
            font-size: clamp(0.9rem, 1.8vw, 1.2rem);
            font-weight: bold;
            letter-spacing: 1px;
        }

        .location-txt {
            color: #a0aec0;
            font-size: clamp(0.75rem, 1.5vw, 0.95rem);
            margin-top: 2px;
        }

        @media (max-width: 600px) {
            .services-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- الهيدر والعنوان -->
        <div class="header-section">
            <h1 class="main-title">🎮 عالم الألعاب 🎮</h1>
            <div class="version-badge">PS4 GoldHEN Host - FW 7.00 - 13.00</div>
        </div>

        <!-- المستطيل التفاعلي المتمركز بالمنتصف -->
        <div class="status-section">
            <div class="status-overlay state-blue" id="box">
                <div class="status-text" id="msgs">جاري تحميل الصفحة... 0%</div>
            </div>
        </div>

        <!-- الأزرار والخدمات بالأيقونات البرمجية عالية الدقة -->
        <div class="services-grid">
            <div class="service-card">
                <svg class="service-icon" viewBox="0 0 24 24"><path d="M21 3H3c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h5v2h8v-2h5c1.1 0 1.99-.9 1.99-2L23 5c0-1.1-.9-2-2-2zm0 14H3V5h18v12z"/></svg>
                <span class="service-title">صالة ألعاب</span>
            </div>
            <div class="service-card">
                <svg class="service-icon" viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
                <span class="service-title">تحميل الألعاب</span>
            </div>
            <div class="service-card">
                <svg class="service-icon" viewBox="0 0 24 24"><path d="M22.7 19l-9.1-9.1c.9-2.3.4-5-1.5-6.9-2-2-5-2.4-7.4-1.3L9 6 6 9 1.6 4.6C.4 7 1 10 3 12c1.9 1.9 4.6 2.4 6.9 1.5l9.1 9.1c.4.4 1 .4 1.4 0l2.3-2.3c.4-.4.4-1.1 0-1.3z"/></svg>
                <span class="service-title">صيانة PS4</span>
            </div>
            <div class="service-card">
                <svg class="service-icon" viewBox="0 0 24 24"><path d="M15 7.5V2H9v5.5l3 3 3-3zM7.5 9H2v6h5.5l3-3-3-3zM9 16.5V22h6v-5.5l-3-3-3 3zM16.5 9l-3 3 3 3H22V9h-5.5z"/></svg>
                <span class="service-title">ملحقات سوني</span>
            </div>
        </div>

        <!-- التذييل والمعلومات -->
        <div class="footer-section">
            <div class="footer-arc"></div>
            <div class="phone-num">780621076</div>
            <div class="location-txt">الموقع: الشحر - شارع مسجد وبير</div>
        </div>

    </div>

    <!-- برمجة تغيير الحالات والحفظ أوفلاين -->
    <script>
        var box = document.getElementById('box');
        var msgBox = document.getElementById('msgs');

        function setStatus(stateClass, text) {
            box.className = "status-overlay " + stateClass;
            msgBox.innerHTML = text;
        }

        if (window.applicationCache) {
            var appCache = window.applicationCache;

            appCache.addEventListener('checking', function() {
                setStatus('state-blue', 'جاري تحميل الصفحة...');
            }, false);

            appCache.addEventListener('downloading', function() {
                setStatus('state-blue', 'جاري تحميل الصفحة... 0%');
            }, false);

            appCache.addEventListener('progress', function(e) {
                if (e.lengthComputable && e.total > 0) {
                    var percent = Math.round((e.loaded / e.total) * 100);
                    setStatus('state-blue', 'جاري تحميل الصفحة... ' + percent + '%');
                } else {
                    setStatus('state-blue', 'جاري تحميل الصفحة...');
                }
            }, false);

            appCache.addEventListener('cached', function() {
                startGoldhenActivation();
            }, false);

            appCache.addEventListener('noupdate', function() {
                startGoldhenActivation();
            }, false);

            appCache.addEventListener('error', function() {
                setStatus('state-red', 'فشل التفعيل يرجى اعاده تشغيل السوني والمحاوله مره اخرا');
            }, false);
        } else {
            startGoldhenActivation();
        }

        function startGoldhenActivation() {
            setStatus('state-yellow', 'جاري التفعيل التلقائي...');
        }
    </script>
</body>
</html>
