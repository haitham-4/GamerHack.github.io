<!DOCTYPE html>
<html manifest="offline.manifest" lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفعيل PS4 - عالم الألعاب</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: #05070f;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            direction: rtl;
        }

        /* حاوية العرض المتناسقة مع أبعاد السوني 16:9 */
        .stage {
            position: relative;
            width: 100vw;
            height: calc(100vw * 9 / 16);
            max-height: 100vh;
            max-width: calc(100vh * 16 / 9);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* الصورة بحجمها الصحيح والدقيق بدون أي تشويه للبكسلات */
        .banner-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        /* المستطيل التفاعلي مطابق لسنتر المستطيل في الصورة تماماً */
        .status-overlay {
            position: absolute;
            top: 46.8%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 52.5%;
            height: 16%;
            background: rgba(5, 7, 15, 0.95);
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 5px 15px;
            transition: all 0.3s ease-in-out;
        }

        /* 1. حواف أزرق (عند حفظ وتحميل الصفحة) */
        .state-blue {
            border: 3px solid #00d2ff;
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.8);
            color: #00d2ff;
        }

        /* 2. حواف أصفر (عند بدء تفعيل القولدهين) */
        .state-yellow {
            border: 3px solid #ffcc00;
            box-shadow: 0 0 15px rgba(255, 204, 0, 0.8);
            color: #ffcc00;
        }

        /* 3. حواف أخضر (عند نجاح العملية) */
        .state-green {
            border: 3px solid #00ff88;
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.8);
            color: #00ff88;
        }

        /* 4. حواف أحمر (عند الفشل) */
        .state-red {
            border: 3px solid #ff4d4d;
            box-shadow: 0 0 15px rgba(255, 77, 77, 0.8);
            color: #ff4d4d;
        }

        /* تنسيق الخط ليجلس في المنتصف تماماً وتناسب حجمه مع السوني */
        .status-text {
            font-size: calc(0.8rem + 1.2vw);
            font-weight: bold;
            line-height: 1.2;
            text-shadow: 0 0 8px currentColor;
            width: 100%;
        }
    </style>
</head>
<body>

    <!-- المسرح الأساسي بأبعاد 16:9 الشاشة العريضة -->
    <div class="stage">
        <img src="../logo.png" alt="عالم الألعاب" class="banner-img">

        <!-- المستطيل ذو الحواف التفاعلية والنص المتمركز -->
        <div class="status-overlay state-blue" id="box">
            <div class="status-text" id="msgs">جاري تحميل الصفحة... 0%</div>
        </div>
    </div>

    <script>
        var box = document.getElementById('box');
        var msgBox = document.getElementById('msgs');

        // دالة تحديث الحالات والألوان
        function setStatus(stateClass, text) {
            box.className = "status-overlay " + stateClass;
            msgBox.innerHTML = text;
        }

        if (window.applicationCache) {
            var appCache = window.applicationCache;

            // 1. عند التحميل والحفظ (حواف زرقاء)
            appCache.addEventListener('checking', function() {
                setStatus('state-blue', 'جاري تحميل الصفحة...');
            }, false);

            appCache.addEventListener('downloading', function() {
                setStatus('state-blue', 'جاري تحميل الصفحة... 0%');
            }, false);

            appCache.addEventListener('progress', function(e) {
                if (e.lengthComputable && e.total > 0) {
                    var percent = Math.round((e.loaded / e.total) * 100);
                    setStatus('state-blue', 'جاري تحميل الصفحة... ' + percent + '%');
                } else {
                    setStatus('state-blue', 'جاري تحميل الصفحة...');
                }
            }, false);

            // 2. عند بدء التفعيل بعد التخزين أوفلاين (حواف صفراء)
            appCache.addEventListener('cached', function() {
                startGoldhenActivation();
            }, false);

            appCache.addEventListener('noupdate', function() {
                startGoldhenActivation();
            }, false);

            // 3. عند الفشل (حواف حمراء)
            appCache.addEventListener('error', function() {
                setStatus('state-red', 'فشل التفعيل يرجى اعاده تشغيل السوني والمحاوله مره اخرا');
            }, false);
        } else {
            startGoldhenActivation();
        }

        // دالة بدء التفعيل
        function startGoldhenActivation() {
            // أصفر أثناء التفعيل
            setStatus('state-yellow', 'جاري التفعيل التلقائي...');

            // ملاحظة: عند نجاح ثغرة GoldHEN في ملفات الهوست يتم استدعاء:
            // setStatus('state-green', 'نجحت العملية');
        }
    </script>
</body>
</html>
