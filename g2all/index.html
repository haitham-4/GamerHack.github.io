<!DOCTYPE html>
<html manifest="offline.manifest" lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PS4 FW GoldHEN Host by GamerHack</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden; /* يمنع ظهور التمرير تماماً */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
        }

        body {
            /* مسار صورة الخلفية */
            background: url('../img.jpg') no-repeat center center fixed;
            background-size: cover;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 30px 20px;
        }

        /* طبقة تظليل سوداء خفيفة لإبراز النصوص */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.45);
            z-index: 1;
        }

        .main-container {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
        }

        /* 1. العنوان العلوي */
        .header-title {
            font-size: 1.4rem;
            font-weight: bold;
            color: #ffffff;
            text-shadow: 0px 2px 10px rgba(0, 0, 0, 0.9);
            margin-top: 10px;
        }

        /* 2. نص الكاش بالمنتصف */
        .status-box {
            text-align: center;
        }

        .status-text {
            font-size: 2.2rem;
            font-weight: bold;
            color: #ffffff;
            text-shadow: 0px 0px 15px rgba(0, 0, 0, 0.9);
        }

        /* 3. أسماء المطورين بالأسفل */
        .special-thanks {
            font-size: 1.1rem;
            text-shadow: 0px 2px 8px rgba(0, 0, 0, 0.9);
            margin-bottom: 15px;
        }

        .thanks-1 { color: #ff5555; font-weight: bold; }
        .thanks-2 { color: #ffffff; font-weight: bold; }
        .thanks-3 { color: #ff9933; font-weight: bold; }
        .thanks-4 { color: #55ffff; font-weight: bold; }
    </style>
</head>
<body>

    <div class="overlay"></div>

    <div class="main-container">

        <!-- العنوان العلوي -->
        <div class="header-title">
            PS4 [5.05] 7.00 - 13.00 FW GoldHEN Host by GamerHack
        </div>

        <!-- نص التثبيت المباشر بالمنتصف -->
        <div class="status-box">
            <h1 class="status-text" id="msgs">Installing Offline Cache: 0%</h1>
        </div>

        <!-- أسماء المطورين في الأسفل -->
        <div class="special-thanks">
            Special Thanks to: 
            <span class="thanks-1">@_AlAzif</span> 
            <span class="thanks-2">ChendoChap</span> 
            <span class="thanks-3">@Kameleonre_</span> 
            <span class="thanks-4">SiSTR0</span>
        </div>

    </div>

    <!-- كود الجافا سكريبت للتحميل التلقائي وتحديث النسبة -->
    <script>
        if (window.applicationCache) {
            var appCache = window.applicationCache;

            // عند بدء التحقق من الملفات
            appCache.addEventListener('checking', function() {
                document.getElementById('msgs').innerHTML = "Checking Offline Cache...";
            }, false);

            // عند بدء التحميل
            appCache.addEventListener('downloading', function() {
                document.getElementById('msgs').innerHTML = "Installing Offline Cache: 0%";
            }, false);

            // أثناء تحميل الملفات (تحديث النسبة المئوية تلقائياً)
            appCache.addEventListener('progress', function(e) {
                if (e.lengthComputable && e.total > 0) {
                    var percent = Math.round((e.loaded / e.total) * 100);
                    document.getElementById('msgs').innerHTML = "Installing Offline Cache: " + percent + "%";
                } else {
                    document.getElementById('msgs').innerHTML = "Installing Offline Cache...";
                }
            }, false);

            // عند الانتهاء وتثبيت الكاش بنجاح
            appCache.addEventListener('cached', function() {
                document.getElementById('msgs').innerHTML = "Offline Cache Installed Successfully!";
            }, false);

            // إذا كانت الصفحة مخزنة مسبقاً ولا توجد تحديثات جديدة
            appCache.addEventListener('noupdate', function() {
                document.getElementById('msgs').innerHTML = "Page Already Cached! (Offline Ready)";
            }, false);

            // في حال حدوث خطأ أثناء التثبيت
            appCache.addEventListener('error', function() {
                document.getElementById('msgs').innerHTML = "Page Cached! (Offline Ready)";
            }, false);
        }
    </script>
</body>
</html>
